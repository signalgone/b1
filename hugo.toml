baseURL = 'https://signalgone.github.io/b1/'
languageCode = 'en-us'
title = 'Signal Gone'
theme = 'PaperMod'
staticDir = ['static']

ShowToc = true


[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
    [markup.goldmark.renderer]
      unsafe = true

[services]
  [services.googleAnalytics]
    ID = 'G-WMYWWL631H'

[params]
math = true
ShowReadingTime = true
ShowShareButtons = false
ShowBreadCrumbs = true

 #[[params.social]]
    #name = "twitter"
    #url = "https://twitter.com/yourhandle"

  #[[params.social]]
    #name = "github"
    #url = "https://github.com/yourhandle"

[params.homeInfoParams]
Title = "Welcome to my blog"
Content = "Modelling and Quantitative Finance."



[taxonomies]
tag = "tags"
category = "categories"

[[menu.main]]
identifier = "about me"
name = "about me"
url = "/about/"
weight = 10


[[menu.main]]
identifier = "tags"
name = "tags"
url = "/tags/"
weight = 20


[[menu.main]]
identifier = "posts"
name = "posts"
url = "/posts/"
weight = 30
 
[build]
  writeStats = true

[imaging]
resampleFilter = "box"
quality = 75


